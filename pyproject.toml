[project]
name = "lcdstudio"
version = "1.4.0"
description = "LCD Studio - lcdpanel 보드 화면 꾸미기"
requires-python = ">=3.10"
dependencies = [
  "flet==1.0.3",
  "pillow",
  "flet-lcdble",
]

[tool.flet]
org = "com.ryusa"
product = "LCD Studio"
company = "ryusa"

# 블루투스 확장 (같은 폴더의 flet_lcdble)
[tool.flet.dev_packages]
flet-lcdble = "flet_lcdble"

[tool.flet.flutter.pubspec.dependency_overrides]
jni = "1.1.0"

# 블루투스 권한 (Android 12+ 는 SCAN/CONNECT, 그 아래는 위치 권한이 필요)
[tool.flet.android.permission]
"android.permission.BLUETOOTH" = true
"android.permission.BLUETOOTH_ADMIN" = true
"android.permission.BLUETOOTH_SCAN" = true
"android.permission.BLUETOOTH_CONNECT" = true
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.INTERNET" = true
